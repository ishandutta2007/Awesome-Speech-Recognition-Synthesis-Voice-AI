<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0c16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .audio-bar {
      transform-origin: bottom;
      animation: pulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scaleY(0.25); opacity: 0.35; }
      50% { transform: scaleY(0.95); opacity: 0.85; }
      100% { transform: scaleY(0.4); opacity: 0.45; }
    }
    .wave-float {
      animation: waveFloat 6s ease-in-out infinite alternate;
    }
    @keyframes waveFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }
    .particle {
      animation: floatParticle 4s infinite linear;
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-35px) scale(1.2); opacity: 0; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Subtle High-tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.7">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Audio Visualizer Bars in Deep Background -->
  <g transform="translate(100, 310)" opacity="0.45">
    <!-- 36 animated audio visualizer spectrum bars -->
    <rect class="audio-bar" x="0" y="-80" width="8" height="80" rx="4" fill="#38bdf8" style="animation-delay: 0.1s;" />
    <rect class="audio-bar" x="18" y="-120" width="8" height="120" rx="4" fill="#38bdf8" style="animation-delay: 0.4s;" />
    <rect class="audio-bar" x="36" y="-60" width="8" height="60" rx="4" fill="#818cf8" style="animation-delay: 0.2s;" />
    <rect class="audio-bar" x="54" y="-140" width="8" height="140" rx="4" fill="#818cf8" style="animation-delay: 0.7s;" />
    <rect class="audio-bar" x="72" y="-100" width="8" height="100" rx="4" fill="#c084fc" style="animation-delay: 0.3s;" />
    <rect class="audio-bar" x="90" y="-160" width="8" height="160" rx="4" fill="#c084fc" style="animation-delay: 0.9s;" />
    <rect class="audio-bar" x="108" y="-75" width="8" height="75" rx="4" fill="#e879f9" style="animation-delay: 0.15s;" />
    <rect class="audio-bar" x="126" y="-110" width="8" height="110" rx="4" fill="#38bdf8" style="animation-delay: 0.6s;" />
    <rect class="audio-bar" x="144" y="-150" width="8" height="150" rx="4" fill="#38bdf8" style="animation-delay: 0.8s;" />
    <rect class="audio-bar" x="162" y="-90" width="8" height="90" rx="4" fill="#818cf8" style="animation-delay: 0.35s;" />

    <rect class="audio-bar" x="840" y="-85" width="8" height="85" rx="4" fill="#818cf8" style="animation-delay: 0.25s;" />
    <rect class="audio-bar" x="858" y="-130" width="8" height="130" rx="4" fill="#c084fc" style="animation-delay: 0.75s;" />
    <rect class="audio-bar" x="876" y="-65" width="8" height="65" rx="4" fill="#c084fc" style="animation-delay: 0.1s;" />
    <rect class="audio-bar" x="894" y="-155" width="8" height="155" rx="4" fill="#f43f5e" style="animation-delay: 0.85s;" />
    <rect class="audio-bar" x="912" y="-115" width="8" height="115" rx="4" fill="#38bdf8" style="animation-delay: 0.45s;" />
    <rect class="audio-bar" x="930" y="-140" width="8" height="140" rx="4" fill="#38bdf8" style="animation-delay: 0.65s;" />
    <rect class="audio-bar" x="948" y="-70" width="8" height="70" rx="4" fill="#818cf8" style="animation-delay: 0.2s;" />
    <rect class="audio-bar" x="966" y="-125" width="8" height="125" rx="4" fill="#818cf8" style="animation-delay: 0.5s;" />
    <rect class="audio-bar" x="984" y="-160" width="8" height="160" rx="4" fill="#c084fc" style="animation-delay: 0.95s;" />
    <rect class="audio-bar" x="1002" y="-90" width="8" height="90" rx="4" fill="#e879f9" style="animation-delay: 0.3s;" />
  </g>

  <!-- Ambient Wave Ribbons across middle background -->
  <g opacity="0.3" class="wave-float">
    <path d="M 0,220 C 300,160 500,280 800,200 C 1000,150 1100,230 1200,210 L 1200,360 L 0,360 Z" fill="url(#accent-cyan)" />
    <path d="M 0,240 C 250,290 600,170 850,250 C 1050,300 1150,220 1200,240 L 1200,360 L 0,360 Z" fill="url(#accent-purple)" />
  </g>

  <!-- Soundwave Curved Lines (SVG Waveform) -->
  <path d="M 50,230 Q 150,190 250,230 T 450,230 T 650,230 T 850,230 T 1050,230 T 1150,230" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" filter="url(#glow-subtle)" />
  <path d="M 50,240 Q 150,280 250,240 T 450,240 T 650,240 T 850,240 T 1050,240 T 1150,240" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.5" filter="url(#glow-subtle)" />

  <!-- Floating Audio Spark Particles -->
  <circle class="particle" cx="220" cy="180" r="2.5" fill="#38bdf8" style="animation-delay: 0.5s;" />
  <circle class="particle" cx="380" cy="200" r="3" fill="#818cf8" style="animation-delay: 1.2s;" />
  <circle class="particle" cx="820" cy="190" r="2" fill="#c084fc" style="animation-delay: 2.1s;" />
  <circle class="particle" cx="960" cy="170" r="3.5" fill="#f43f5e" style="animation-delay: 0.8s;" />

  <!-- ================= FOREGROUND (Crisp & Fully Legible) ================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(600, 52)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Glowing green active dot -->
    <circle cx="-160" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-146" y="5" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">CURATED ECOSYSTEM • VOICE AI &amp; AUDIO</text>
  </g>

  <!-- Main Title: AWESOME SPEECH RECOGNITION & SYNTHESIS -->
  <text x="600" y="128" text-anchor="middle" font-size="38" font-weight="900" fill="url(#primary-grad)" letter-spacing="-0.5" filter="url(#glow-subtle)">
    Awesome Speech Recognition &amp; Synthesis
  </text>

  <!-- Prominent Subtitle -->
  <text x="600" y="172" text-anchor="middle" font-size="20" font-weight="600" fill="#f8fafc" letter-spacing="0.2">
    Top Voice AI Ecosystem: ASR, STT, Zero-Shot TTS &amp; Real-Time Voice Agents
  </text>

  <!-- Tag Pills Row (Foreground) -->
  <g transform="translate(600, 222)">
    <!-- Pill 1: STT / ASR -->
    <g transform="translate(-370, 0)">
      <rect x="0" y="-14" width="135" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="67" y="5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#38bdf8">🎙️ Speech-to-Text</text>
    </g>
    <!-- Pill 2: Neural TTS -->
    <g transform="translate(-215, 0)">
      <rect x="0" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="65" y="5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#818cf8">🔊 Neural TTS</text>
    </g>
    <!-- Pill 3: Voice Cloning -->
    <g transform="translate(-65, 0)">
      <rect x="0" y="-14" width="145" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="72" y="5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c084fc">🧬 Voice Cloning</text>
    </g>
    <!-- Pill 4: Voice Agents -->
    <g transform="translate(100, 0)">
      <rect x="0" y="-14" width="135" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
      <text x="67" y="5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f472b6">🤖 Voice Agents</text>
    </g>
    <!-- Pill 5: Diarization -->
    <g transform="translate(255, 0)">
      <rect x="0" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="65" y="5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#34d399">👥 Diarization</text>
    </g>
  </g>

  <!-- Bottom Accent Tagline -->
  <text x="600" y="278" text-anchor="middle" font-size="13.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    ⚡ High-Performance Open-Source Models • Ultra-Low Latency Edge Runtimes • Enterprise Cloud APIs
  </text>
</svg>
